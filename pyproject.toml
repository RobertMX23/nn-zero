[project]
name = "nn-zero-to-hero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "graphviz>=0.21",
    "ipynb>=0.5.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "notebook>=7.6.1",
    "numpy>=2.5.1",
    "voila>=0.5.12",
]

[project.optional-dependencies]
cu132 = [
    "torch",
    "torchvision",
]
rocm72 = [
    "torch",
    "torchvision",
    "pytorch-triton-rocm",
    "triton-rocm",
]

[tool.uv]
conflicts = [
    [
        { extra = "cu132" },
        { extra = "rocm72" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", extra = "cu132" },
    { index = "pytorch-rocm", extra = "rocm72" },
]
torchvision = [
    { index = "pytorch-cu132", extra = "cu132" },
    { index = "pytorch-rocm", extra = "rocm72" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm72" },
]
triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm72" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
